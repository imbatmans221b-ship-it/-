<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinyin Snake Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
            user-select: none;
        }

        #game-container {
            background-color: #fff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        #target-word-box {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #ecf0f1;
            border-radius: 8px;
            border-left: 5px solid #e74c3c;
        }

        #target-pinyin {
            color: #e74c3c;
            font-size: 26px;
            display: block;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        #board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        #grid-board {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: 1px;
            background-color: #2e3d49;
            padding: 2px;
            border-radius: 8px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .cell {
            background-color: #34495e;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: white;
            overflow: hidden;
            word-break: break-all;
            padding: 1px;
            text-align: center;
        }

        .snake-head { background-color: #27ae60 !important; }
        .snake-body { background-color: #2ecc71 !important; }
        .apple { background-color: #e74c3c !important; }

        #score-board {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
            color: #34495e;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
        }

        .ctrl-btn {
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: background 0.1s;
        }

        .ctrl-btn:active {
            background-color: #16a085;
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        .btn-system {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }

        .btn-system:hover {
            background-color: #d35400;
        }

        /* Screen Overlay for Game Over */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(44, 62, 80, 0.95);
            border-radius: 15px;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        #overlay h2 { margin: 0 0 10px 0; color: #e74c3c; font-size: 28px; }
        #overlay p { margin: 0 0 20px 0; font-size: 16px; color: #ecf0f1; line-height: 1.4; }
        #overlay button { max-width: 200px; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Game Over Screen Overlay -->
        <div id="overlay">
            <h2 id="overlay-title">Game Over</h2>
            <p id="overlay-msg">Reason goes here</p>
            <button class="btn-system" onclick="resetGame()">Play Again</button>
        </div>

        <div id="target-word-box">
            Eat the correct translation for:
            <span id="target-pinyin">Loading...</span>
        </div>

        <div id="board-wrapper">
            <div id="grid-board"></div>
        </div>

        <div id="score-board">
            <span id="score">Score: 0</span>
            <span id="high-score">High Score: 0</span>
        </div>

        <div id="controls">
            <button class="ctrl-btn" id="btn-up">▲</button>
            <button class="ctrl-btn" id="btn-left">◀</button>
            <button class="ctrl-btn" id="btn-right">▶</button>
            <button class="ctrl-btn" id="btn-down">▼</button>
        </div>

        <button class="btn-system" onclick="resetGame()">Reset Game</button>
    </div>

    <script>
        const boardSize = 12; 
        const board = document.getElementById("grid-board");
        const overlay = document.getElementById("overlay");
        
        // Expanded Word Bank (Pinyin -> English)
        const wordBank = [
            { hanzi: "苹果", pinyin: "píngguǒ", english: "Apple" },
            { hanzi: "香蕉", pinyin: "xiāngjiāo", english: "Banana" },
            { hanzi: "猫", pinyin: "māo", english: "Cat" },
            { hanzi: "狗", pinyin: "gǒu", english: "Dog" },
            { hanzi: "水", pinyin: "shuǐ", english: "Water" },
            { hanzi: "米饭", pinyin: "mǐfàn", english: "Rice" },
            { hanzi: "老师", pinyin: "lǎoshī", english: "Teacher" },
            { hanzi: "学生", pinyin: "xuéshēng", english: "Student" },
            { hanzi: "谢谢", pinyin: "xièxie", english: "Thanks" },
            { hanzi: "再见", pinyin: "zàijiàn", english: "Goodbye" },
            { hanzi: "火車", pinyin: "huǒchē", english: "Train" },
            { hanzi: "飛機", pinyin: "fēijī", english: "Plane" },
            { hanzi: "麵包", pinyin: "miànbāo", english: "Bread" },
            { hanzi: "咖啡", pinyin: "kāfēi", english: "Coffee" },
            { hanzi: "茶", pinyin: "chá", english: "Tea" }
        ];

        let snake = [];
        let dx = 1; 
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let apples = [];
        let currentQuestion = {};
        let score = 0;
        let highScore = 0;
        let gameLoopInterval;
        let cells = [];
        let isGameOver = false;

        function createBoard() {
            board.innerHTML = "";
            cells = [];
            for (let i = 0; i < boardSize * boardSize; i++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                board.appendChild(cell);
                cells.push(cell);
            }
        }

        function draw() {
            cells.forEach(cell => {
                cell.className = "cell";
                cell.innerText = "";
            });

            apples.forEach(apple => {
                const index = apple.y * boardSize + apple.x;
                if (cells[index]) {
                    cells[index].classList.add("apple");
                    cells[index].innerText = apple.text;
                }
            });

            snake.forEach((part, idx) => {
                const index = part.y * boardSize + part.x;
                if (cells[index]) {
                    if (idx === 0) {
                        cells[index].classList.add("snake-head");
                        cells[index].innerText = "🐍"; 
                    } else {
                        cells[index].classList.add("snake-body");
                    }
                }
            });
        }

        function generateQuestion() {
            const randomIndex = Math.floor(Math.random() * wordBank.length);
            currentQuestion = wordBank[randomIndex];
            document.getElementById("target-pinyin").innerText = `${currentQuestion.pinyin} (${currentQuestion.hanzi})`;

            let wrongOptions = [];
            while(wrongOptions.length < 2) {
                let wrongWord = wordBank[Math.floor(Math.random() * wordBank.length)].english;
                if(wrongWord !== currentQuestion.english && !wrongOptions.includes(wrongWord)) {
                    wrongOptions.push(wrongWord);
                }
            }

            let answers = [
                { text: currentQuestion.english, isCorrect: true },
                { text: wrongOptions[0], isCorrect: false },
                { text: wrongOptions[1], isCorrect: false }
            ];
            answers.sort(() => Math.random() - 0.5);

            for(let i=0; i<3; i++) {
                let appleX, appleY, overlap;
                let attempts = 0;
                do {
                    overlap = false;
                    appleX = Math.floor(Math.random() * boardSize);
                    appleY = Math.floor(Math.random() * boardSize);
