<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinyin Snake Game - เกมงูฝึกศัพท์จีน</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }

        h1 {
            color: #333;
            margin: 5px 0;
            font-size: 24px;
        }

        #game-container {
            position: relative;
            background-color: #fff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }

        #target-word-box {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #ecf0f1;
            border-radius: 8px;
            border-left: 5px solid #e74c3c;
        }

        #target-pinyin {
            color: #e74c3c;
            font-size: 24px;
            display: block;
            margin-top: 5px;
        }

        canvas {
            background-color: #2e3d49;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }

        #score-board {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            justify-content: center;
            margin: 15px 0 5px 0;
        }

        .ctrl-btn {
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .ctrl-btn:active {
            background-color: #16a085;
            transform: scale(0.95);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        .btn-system {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🐍 Pinyin Snake Game 🍎</h1>
    
    <div id="game-container">
        <div id="target-word-box">
            ตามหาคำแปลของพินอินนี้:
            <span id="target-pinyin">กำลังโหลด...</span>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div id="score-board">
            <span id="score">คะแนน: 0</span>
            <span id="high-score">สูงสุด: 0</span>
        </div>

        <div id="controls">
            <button class="ctrl-btn" id="btn-up">▲</button>
            <button class="ctrl-btn" id="btn-left">◀</button>
            <button class="ctrl-btn" id="btn-right">▶</button>
            <button class="ctrl-btn" id="btn-down">▼</button>
        </div>

        <button class="btn-system" onclick="resetGame()">เริ่มใหม่</button>
        <button class="btn-system" style="background-color: #3498db;" onclick="speakCurrentWord()">🔊 ฟังเสียง</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        const wordBank = [
            { hanzi: "苹果", pinyin: "píngguǒ", thai: "แอปเปิ้ล" },
            { hanzi: "香蕉", pinyin: "xiāngjiāo", thai: "กล้วย" },
            { hanzi: "猫", pinyin: "māo", thai: "แมว" },
            { hanzi: "狗", pinyin: "gǒu", thai: "สุนัข" },
            { hanzi: "水", pinyin: "shuǐ", thai: "น้ำ" },
            { hanzi: "米饭", pinyin: "mǐfàn", thai: "ข้าว" },
            { hanzi: "老师", pinyin: "lǎoshī", thai: "ครู" },
            { hanzi: "学生", pinyin: "xuéshēng", thai: "นักเรียน" },
            { hanzi: "谢谢", pinyin: "xièxie", thai: "ขอบคุณ" },
            { hanzi: "再见", pinyin: "zàijiàn", thai: "ลาก่อน" }
        ];

        let snake = [];
        let dx = gridSize;
        let dy = 0;
        let apples = [];
        let currentQuestion = {};
        let score = 0;
        let highScore = 0;
        let gameInterval;
        let isGameOver = false;

        function speakCurrentWord() {
            if ('speechSynthesis' in window && currentQuestion.hanzi) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentQuestion.hanzi);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.75;
                window.speechSynthesis.speak(utterance);
            }
        }

        function initGame() {
            snake = [{x: 160, y: 200}, {x: 140, y: 200}, {x: 120, y: 200}];
            dx = gridSize;
            dy = 0;
            score = 0;
            isGameOver = false;
            document.getElementById("score").innerText = "คะแนน: " + score;
            generateQuestion();
        }

        function generateQuestion() {
            const randomIndex = Math.floor(Math.random() * wordBank.length);
            currentQuestion = wordBank[randomIndex];
            document.getElementById("target-pinyin").innerText = `${currentQuestion.pinyin} (${currentQuestion.hanzi})`;
            setTimeout(speakCurrentWord, 200);

            let wrongOptions = [];
            while(wrongOptions.length < 2) {
                let wrongWord = wordBank[Math.floor(Math.random() * wordBank.length)].thai;
                if(wrongWord !== currentQuestion.thai && !wrongOptions.includes(wrongWord)) {
                    wrongOptions.push(wrongWord);
                }
            }

            let answers = [
                { text: currentQuestion.thai, isCorrect: true },
                { text: wrongOptions[0], isCorrect: false },
                { text: wrongOptions[1], isCorrect: false }
            ];
            answers.sort(() => Math.random() - 0.5);

            apples = [];
            for(let i=0; i<3; i++) {
                let appleX, appleY, overlap;
                do {
                    overlap = false;
                    appleX = Math.floor(Math.random() * tileCount) * gridSize;
                    appleY = Math.floor(Math.random() * tileCount) * gridSize;
                    for(let part of snake) { if(part.x === appleX && part.y === appleY) overlap = true; }
                    for(let app of apples) { if(app.x === appleX && app.y === appleY) overlap = true; }
                } while(overlap);

                apples.push({ x: appleX, y: appleY, text: answers[i].text, isCorrect: answers[i].isCorrect });
            }
        }

        function main() {
            if (isGameOver) return;
            if (hasGameEnded()) {
                isGameOver = true;
                alert("เกมจบแล้ว! ชนกำแพงหรือชนตัวเอง");
                if(score > highScore) { highScore = score; document.getElementById("high-score").innerText = "สูงสุด: " + highScore; }
                return;
            }
            clearCanvas();
            drawApples();
            moveSnake();
            drawSnake();
            checkAppleCollision();
        }

        function clearCanvas() { ctx.fillStyle = "#2e3d49"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        
        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#27ae60' : '#2ecc71';
                ctx.fillRect(part.x, part.y, gridSize, gridSize);
            });
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            snake.pop();
        }

        function drawApples() {
            apples.forEach(apple => {
                ctx.fillStyle = "#e74c3c";
                ctx.beginPath();
                ctx.arc(apple.x + gridSize/2, apple.y + gridSize/2, gridSize/2 - 2, 0, 2 * Math.PI);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px Arial";
                ctx.textAlign = "center";
                ctx.fillText(apple.text, apple.x + gridSize/2, apple.y - 4);
            });
        }

        function checkAppleCollision() {
            const head = snake[0];
            apples.forEach((apple) => {
                if (head.x === apple.x && head.y === apple.y) {
                    if (apple.isCorrect) {
                        score += 10;
                        document.getElementById("score").innerText = "คะแนน: " + score;
                        snake.push({ ...snake[snake.length - 1] });
                        generateQuestion();
                    } else {
                        isGameOver = true;
                        alert(`กินผิด! คำตอบที่ถูกคือ "${currentQuestion.thai}"`);
                        if(score > highScore) { highScore = score; document.getElementById("high-score").innerText = "สูงสุด: " + highScore; }
                    }
                }
